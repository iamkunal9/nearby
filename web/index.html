    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://nearby.iamkunal9.in/#app",
            "name": "Nearby",
            "url": "https://nearby.iamkunal9.in/",
            "description": "SnapDrop-style peer-to-peer file sharing in the browser. Devices on the same local network auto-discover each other and transfer files or text directly via WebRTC. The server only relays signaling and never sees file bytes.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires a modern browser with WebRTC",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "isAccessibleForFree": true,
            "license": "https://github.com/iamkunal9/nearby/blob/main/LICENSE.md",
            "codeRepository": "https://github.com/iamkunal9/nearby",
            "author": {
              "@type": "Person",
              "name": "iamkunal9",
              "url": "https://github.com/iamkunal9"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://nearby.iamkunal9.in/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Nearby?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Nearby is a SnapDrop-style peer-to-peer file sharing web app. Open it on devices on the same network to share files or text directly browser-to-browser via WebRTC."
                }
              },
              {
                "@type": "Question",
                "name": "Are my files uploaded to a server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. File and text bytes travel on a direct WebRTC DataChannel between devices. The Cloudflare Worker only relays signaling messages (SDP/ICE) for discovery and connection setup."
                }
              },
              {
                "@type": "Question",
                "name": "Do devices need to be on the same network?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Nearby groups devices by public IP (or IPv6 /64 prefix). It is same-network only by design and does not use a TURN relay for cross-network transfers."
                }
              },
              {
                "@type": "Question",
                "name": "Can I self-host Nearby?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The open-source project deploys to Cloudflare Workers (signaling) and Cloudflare Pages (frontend). See the GitHub README for Bun-based install and deploy steps."
                }
              }
            ]
          }
        ]
      }
    </script>
